stages:

- build
- test
- security
- github_pr
- approval
- deploy

include:

- template: Jobs/SAST.gitlab-ci.yml
- template: Jobs/Dependency-Scanning.gitlab-ci.yml
- template: Jobs/Secret-Detection.gitlab-ci.yml

build:
    stage: build
    image: mcr.microsoft.com/dotnet/sdk:8.0

    script:
    - cd app/SampleWebApi
    - dotnet restore
    - dotnet build

github_security_gate:
    stage: security
    image: mcr.microsoft.com/powershell:latest

    script:
    - pwsh scripts/wait-for-codeql.ps1
    - pwsh scripts/github-security-check.ps1

    artifacts:
        when: always
        expire_in: 30 days
        paths:
            - reports/

    allow_failure: false

create_github_pr:
  stage: github_pr

  image:
    name: mcr.microsoft.com/powershell:latest

  before_script:
    - mkdir -p reports

  script:
    - pwsh scripts/create-github-pr.ps1

  artifacts:
    paths:
      - reports/

manual_approval:
    stage: approval
    when: manual

    script:
    - echo "CAB Approval Granted"

deploy:
    stage: deploy

    script:
    - echo "Deploying Application"
